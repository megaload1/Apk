name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Initialize Capacitor
        run: |
          # Disable telemetry for cleaner CI
          npx cap telemetry off
          
          # Check if android platform exists, if not add it
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sync assets and plugins
          npx cap sync android

      - name: Generate App Icons
        run: |
          # Use standard Capacitor assets generation
          # It looks for assets/icon.png and assets/splash.png automatically
          npx @capacitor/assets generate --android

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrikeForce-Booster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
